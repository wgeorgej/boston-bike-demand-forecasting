services:
  # MLflow tracking server and portable artifact store
  mlflow:
    image: boston-bike-demand:local
    build:
      context: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-store:/mlflow
    restart: unless-stopped

  # Dashboard
  app-ui:
    image: boston-bike-demand:local
    build:
      context: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8050
      - --workers
      - "2"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - app_ui.app:server
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      PYTHONPATH: "/app/src"
    volumes:
      - ./data:/app/data:ro
      - ./conf:/app/conf:ro
    restart: unless-stopped

  # Run training only when explicitly requested
  ml-train:
    image: boston-bike-demand:local
    profiles: ["jobs"]
    command: ["python", "entrypoints/training.py"]
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_REGISTRY_URI: "http://mlflow:5000"
    volumes:
      - ./data:/app/data:ro
      - ./conf:/app/conf:ro
    depends_on:
      - mlflow

  # Run inference only when explicitly requested
  ml-inference:
    image: boston-bike-demand:local
    profiles: ["jobs"]
    command: ["python", "entrypoints/inference.py"]
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_REGISTRY_URI: "http://mlflow:5000"
    volumes:
      - ./data:/app/data
      - ./conf:/app/conf:ro
    depends_on:
      - mlflow

volumes:
  mlflow-store: