name: Docker Image Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image for pull request validation
        if: github.event_name == 'pull_request'
        run: docker build --tag boston-bike-demand:ci .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: |
          IMAGE_REF="ghcr.io/${IMAGE_NAME,,}"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}"
          docker build --pull \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --tag "$IMAGE_REF:latest" \
            --tag "$IMAGE_REF:$GITHUB_SHA" \
            .
          docker push "$IMAGE_REF:latest"
          docker push "$IMAGE_REF:$GITHUB_SHA"
